function syncSet(){SET.forEach(([k,l,t])=>{const e=$("s_"+k);if(t==="chk")e.checked=CFG[k];else if(t==="rng"){e.value=CFG[k];e.style.setProperty("--p",(CFG[k]-e.min)/(e.max-e.min)*100+"%");$("v_"+k).textContent=k==="rate"?(CFG[k]/100).toFixed(2)+"배":CFG[k]+"%"}else e.value=CFG[k]})}
function syncVoices(){const l=Voice.list(),m=Voice.match(),s=$("s_voice"),en=$("s_engine");en.innerHTML='<option value="google">Google</option><option value="microsoft">Microsoft</option>';en.value=CFG.engine;s.innerHTML=l.length?l.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${v.localService?"기기 내장":"온라인"})</option>`).join(""):`<option value="">한국어 음성 없음</option>`;if(!l.some(v=>v.voiceURI===CFG.voice))CFG.voice=l[0]?l[0].voiceURI:"";s.value=CFG.voice;const nm=CFG.engine==="microsoft"?"Microsoft":"Google";
 $("voiceNote").textContent=!l.length?"한국어 음성이 없어 읽어주기가 작동하지 않습니다. OS 설정에서 한국어 음성을 설치해 보세요.":CFG.engine==="google"&&TTS_PROXY_URL?"Google Cloud TTS(백엔드) 사용 중. 연결 실패 시 브라우저 음성으로 대체됩니다.":m.length?`${nm} 한국어 음성 ${m.length}개 (브라우저 내장). 실제 품질은 미리듣기로 확인하세요.`:`이 브라우저에는 ${nm} 한국어 음성이 없어 다른 한국어 음성으로 대체합니다. (Google: Chrome, Microsoft: Edge에서 주로 제공)`}
$("setRows").innerHTML=SET.map(([k,l,t,a,b])=>`<div class="set"><label for="s_${k}">${l}</label>`+(t==="chk"?`<input type="checkbox" id="s_${k}"><span></span>`:t==="sel"?`<select id="s_${k}"></select><span></span>`:`<input type="range" id="s_${k}" min="${a}" max="${b}" step="1"><span id="v_${k}"></span>`)+`</div>`).join("")+`<p class="muted" id="voiceNote"></p>`;
SET.forEach(([k,l,t])=>{const e=$("s_"+k);e.oninput=e.onchange=()=>{CFG[k]=t==="chk"?e.checked:t==="sel"?e.value:+e.value;if(k==="ttsOn"&&!CFG.ttsOn)Voice.stop();if(k==="engine"){CFG.voice="";Voice.stop();syncVoices()}syncSet();save()}});
$("s_sfxVol").addEventListener("change",()=>{Sfx.init();Sfx.select()});$("s_sfxOn").addEventListener("change",()=>{Sfx.init();Sfx.select()});
syncVoices();syncSet();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{syncVoices();syncSet()};
$("setB").onclick=()=>{Sfx.init();Voice.unlocked=true;syncVoices();syncSet();$("setModalHost").appendChild($("setRows"));show("settings",true)};$("setClose").onclick=()=>show("settings",false);$("settings").onclick=e=>{if(e.target.id==="settings")show("settings",false)};
$("testB").onclick=()=>{Voice.unlocked=true;Voice.stop();Voice.speak("안녕하세요. 새로운 문자가 도착했습니다.",0);Voice.speak("저는 답장하는 사람입니다. 목소리가 구분되나요?",2)};$("pickMode").onchange=e=>act("pick",{m:e.target.value});
$("joinB").onclick=joinRoom;$("startB").onclick=()=>act("start");$("target").onchange=e=>act("target",{n:+e.target.value});$("leaveB").onclick=$("quitB").onclick=()=>location.reload();
function go(n){document.querySelectorAll(".pn").forEach(p=>p.classList.toggle("on",p.id==="pn-"+n));document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("act",b.dataset.go===n||(n==="create"&&b.dataset.go==="start")));if(n==="settings"){$("setHost").appendChild($("setRows"));syncVoices();syncSet()}msg("")}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("joinToggle").onclick=()=>show("joinRow",$("joinRow").classList.contains("hidden"));$("cMode").onchange=()=>{$("createB").textContent=$("cMode").value==="solo"?"혼자 플레이 시작":"방 만들기"};
$("createB").onclick=()=>$("cMode").value==="solo"?soloStart():hostRoom();
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.classList.contains("card")||b.id==="sendB")return;Sfx.init();b.closest("#nav")?Sfx.nav():Sfx.click()},true);
document.addEventListener("click",()=>{Sfx.init();Voice.unlocked=true},{once:true});
